# ==========================================
# Neura — Default Configuration
# ==========================================

project:
  name: "Neura"
  version: "1.0.0"
  description: "TensorFlow MVC Machine Learning Project"
  environment: "development"  # development | production

# -----------------------------------------
# Model Configuration
# -----------------------------------------
model:
  name: "BaseNeuralNetwork"
  type: "dense"               # dense | cnn | rnn | transformer
  input_shape: [128]          # Adjust to your data
  output_units: 10            # Number of output classes / values
  output_activation: "softmax" # softmax | sigmoid | linear

  architecture:
    hidden_layers:
      - units: 256
        activation: "relu"
        dropout: 0.3
      - units: 128
        activation: "relu"
        dropout: 0.2
      - units: 64
        activation: "relu"
        dropout: 0.1

# -----------------------------------------
# Training Configuration
# -----------------------------------------
training:
  epochs: 50
  batch_size: 32
  validation_split: 0.2
  shuffle: true
  seed: 42

  optimizer:
    name: "adam"
    learning_rate: 0.001
    weight_decay: 0.0

  loss: "categorical_crossentropy"  # or "mse", "binary_crossentropy"
  metrics:
    - "accuracy"

  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10
    restore_best_weights: true

  reduce_lr:
    enabled: true
    monitor: "val_loss"
    factor: 0.5
    patience: 5
    min_lr: 1e-7

# -----------------------------------------
# Data Configuration
# -----------------------------------------
data:
  source: "csv"               # csv | tfrecord | numpy | image_dir
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  target_column: "label"
  feature_columns: []         # empty = all except target

  preprocessing:
    normalize: true
    normalization_method: "minmax"  # minmax | zscore | none
    handle_missing: "mean"          # mean | median | drop | none
    encode_categoricals: true

  augmentation:
    enabled: false
    methods: []

# -----------------------------------------
# Paths (Public)
# -----------------------------------------
paths:
  checkpoints: "public/checkpoints"
  exports: "public/exports"
  logs: "public/logs"
  reports: "public/reports"
  assets: "public/assets"

# -----------------------------------------
# Logging
# -----------------------------------------
logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "public/logs/neura.log"
  tensorboard: true
