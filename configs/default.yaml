# ==========================================
# Neura — Default Configuration
# ==========================================

project:
  name: "Neura"
  version: "1.0.0"
  description: "TensorFlow MVC Machine Learning Project"
  environment: "development"  # development | production

# -----------------------------------------
# Model Configuration
# -----------------------------------------
model:
  name: "AlzheimersXGBoost"
  algorithm: "xgboost"
  type: "gradient_boosted_trees"
  input_shape: [32]            # 32 clinical & cognitive biomarkers
  output_units: 2             # Binary classification: 0 (Negative) vs 1 (Alzheimer's)
  output_activation: "sigmoid"

  hyperparameters:
    n_estimators: 300
    learning_rate: 0.08
    max_depth: 4
    min_child_weight: 3
    subsample: 0.85
    colsample_bytree: 0.85
    scale_pos_weight: 1.83
    gamma: 0.2
    eval_metric: "logloss"

# -----------------------------------------
# Training Configuration
# -----------------------------------------
training:
  epochs: 100                 # Max boosting iterations / trees
  batch_size: 32
  validation_split: 0.2
  shuffle: true
  seed: 42

  early_stopping:
    enabled: true
    monitor: "val_logloss"
    patience: 25

# -----------------------------------------
# Data Configuration
# -----------------------------------------
data:
  source: "csv"
  train_path: "datasets/alzheimers_disease_data.csv"
  test_path: "datasets/alzheimers_disease_data.csv"
  target_column: "Diagnosis"
  id_column: "PatientID"
  drop_columns:
    - "PatientID"
    - "DoctorInCharge"

  preprocessing:
    normalize: false          # Tree-based algorithms do not require feature scaling
    handle_missing: "median"
    encode_categoricals: false

# -----------------------------------------
# Paths (Public)
# -----------------------------------------
paths:
  checkpoints: "public/checkpoints"
  exports: "public/exports"
  logs: "public/logs"
  reports: "public/reports"
  assets: "public/assets"

# -----------------------------------------
# Logging
# -----------------------------------------
logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "public/logs/neura.log"
  tensorboard: true
